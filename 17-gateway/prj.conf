CONFIG_LOG=y
CONFIG_SHELL=y

# Wi-Fi: AP (sensor side, enabled unconditionally at boot - see
# README.md "Why the AP side doesn't wait for anything") + STA (uplink,
# provisioned over the shell exactly like 07-wifi/08-http/15-mqtt).
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# MQTT broker (wolfMQTT) + the internal loopback client, both over
# plain POSIX sockets.
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_TCP=y
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_MAIN_STACK_SIZE=4096

# Broker's own listener + a couple of sensor clients + the loopback
# uplink client - see src/user_settings.h for the matching BROKER_MAX_*.
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_MAX_CONN=6
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

CONFIG_WOLFMQTT=y
CONFIG_WOLFMQTT_SETTINGS_FILE="user_settings.h"
