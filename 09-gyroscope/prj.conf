CONFIG_LOG=y
CONFIG_SHELL=y

# Onboard MPU6886 (accel + gyro), already enabled in the board's devicetree
CONFIG_SENSOR=y

# Sampling thread publishes readings here; any number of listeners can
# subscribe without the sampling thread knowing or caring about them.
CONFIG_ZBUS=y
