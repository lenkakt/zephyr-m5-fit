CONFIG_LOG=y
CONFIG_SHELL=y

# Wi-Fi - same as 07-wifi
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WIFI=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# HTTP client, over plain POSIX sockets
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_HTTP_CLIENT=y
CONFIG_NET_TCP=y

# Onboard peripherals this example drives
CONFIG_LED_STRIP=y
CONFIG_INPUT=y
