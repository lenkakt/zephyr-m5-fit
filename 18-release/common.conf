# Shared between the dev and release builds - pulled in via
# EXTRA_CONF_FILE (see CMakeLists.txt), which merges on top of
# whichever of prj.conf/prj_release.conf FILE_SUFFIX selects, rather
# than being replaced by it the way CONF_FILE itself would be.

CONFIG_LOG=y
CONFIG_HWINFO=y

# Settings subsystem, NVS-backed - the same mechanism 07-wifi's
# wifi_credentials already uses on this board (see 07-wifi/prj.conf
# for why each line below is needed individually). Here it stores an
# assigned serial number instead, under its own "device/" key
# namespace - the two coexist in the same storage partition without
# conflict, since Settings is a key-value store, not a single slot.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
