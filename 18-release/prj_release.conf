#
# Release build - selected via FILE_SUFFIX=release, which replaces
# prj.conf with this file for CONF_FILE (not a merge - see
# CMakeLists.txt's comment on EXTRA_CONF_FILE for how the shared
# config in common.conf still reaches this build anyway).
#
# Build with: west build ... -- -DFILE_SUFFIX=release
#
# Nothing to turn on here - CONFIG_SHELL defaults to n, and
# CONFIG_SETTINGS_SHELL depends on it, so leaving both unset already
# means "no shell" (no provisioning, no unsigned access) in this
# build. Listed explicitly anyway so the intent reads as deliberate,
# not incidental - this is what actually changes for production.
CONFIG_SHELL=n
CONFIG_SETTINGS_SHELL=n

# FOLLOWING SHALL NEVER BE SWITCHED ON AT A SHARED LAB MACHINE!!!
# A real product's release config also adds, at this point:
#   CONFIG_BOOTLOADER_MCUBOOT=y, signed with a real production key
#   (instead of the debug/test key used during development), and
#   CONFIG_ESP_FLASH_ENCRYPTION=y. Both are covered conceptually in
# the security talk and deliberately not built here - the first
# makes an irreversible eFuse change, not something to run on shared
# lab hardware.
