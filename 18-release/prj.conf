# Development build - everything shared with the release build lives
# in common.conf (pulled in via EXTRA_CONF_FILE). Only the dev-only
# bits live here: the shell, needed to provision the serial number
# over `settings write` on the line.

CONFIG_SHELL=y
CONFIG_SETTINGS_SHELL=y
