CONFIG_LOG=y
CONFIG_SHELL=y

# Angle Unit is a bare potentiometer, no Zephyr sensor driver exists
# for it, so this reads the ADC directly instead of going through
# CONFIG_SENSOR like 09-gyroscope does.
CONFIG_ADC=y

# Sampling thread publishes readings here; the logging thread is just
# one subscriber among however many you add.
CONFIG_ZBUS=y
