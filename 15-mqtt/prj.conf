CONFIG_LOG=y
CONFIG_SHELL=y

# Wi-Fi - same as 07-wifi/08-http
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WIFI=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# MQTT client, over plain POSIX sockets - no TLS, to keep this starter
# example simple (see talk08: anonymous/plain access is a fine choice
# for a closed classroom network, just not for anything exposed).
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_TCP=y
CONFIG_MQTT_LIB=y

CONFIG_NET_BUF_DATA_SIZE=256
