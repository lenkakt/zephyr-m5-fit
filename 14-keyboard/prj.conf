CONFIG_LOG=y
CONFIG_SHELL=y

# CardKB is a plain I2C device with no Zephyr driver (it's a keyboard
# controller, not a generic sensor), so this reads it directly over
# I2C in src/main.c instead of going through CONFIG_SENSOR.
CONFIG_I2C=y

# Sampling thread publishes readings here; the logging thread is just
# one subscriber among however many you add.
CONFIG_ZBUS=y
