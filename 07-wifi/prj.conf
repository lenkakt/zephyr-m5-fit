CONFIG_LOG=y
CONFIG_SHELL=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WIFI=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Wi-Fi credentials subsystem: stores SSID/password in flash (via the
# settings subsystem below), provisioned once over the shell - never
# written into this source tree.
#
# CONFIG_SETTINGS=y alone is NOT enough - its own backend choice
# defaults to CONFIG_SETTINGS_NONE unless a concrete one is selected,
# which leaves wifi_credentials.c linked against a backend that was
# never compiled in (undefined reference to wifi_credentials_backend_init
# and friends). The NVS backend needs its own dependency chain enabled
# by hand too (flash driver, flash map, NVS itself) - none of these
# default on even once CONFIG_SETTINGS_NVS is set.
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
